function plot(vals,stroke='#168f9b',height=170,fill=true){const arr=vals.map((v,i)=>Number.isFinite(v)?v:0),mi=Math.min(...arr),ma=Math.max(...arr),rg=ma-mi||1;let x=i=>8+(i/(arr.length-1))*584,y=v=>height-14-((v-mi)/rg)*(height-29),pts=arr.map((v,i)=>`${x(i).toFixed(2)},${y(v).toFixed(2)}`).join(' '),last=arr.length-1;return `<svg class="chartsvg" style="height:${height}px" viewBox="0 0 600 ${height}" preserveAspectRatio="none"><defs><linearGradient id="f${height}" x1="0" y1="0" x2="0" y2="1"><stop stop-color="${stroke}" stop-opacity=".17"/><stop offset="1" stop-color="${stroke}" stop-opacity=".01"/></linearGradient></defs>${[.25,.5,.75].map(n=>`<line x1="8" y1="${n*height}" x2="592" y2="${n*height}" stroke="#e8eff2" stroke-dasharray="4 5"/>`).join('')}${fill?`<polygon points="8,${height-5} ${pts} 592,${height-5}" fill="url(#f${height})"/>`:''}<polyline points="${pts}" fill="none" stroke="${stroke}" stroke-width="2.7" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${x(last)}" cy="${y(arr[last])}" r="3.7" fill="${stroke}" stroke="white" stroke-width="1.5"/></svg>`}
function series(seed=1,N=90){let p=100,out=[];for(let i=0;i<N;i++){const noise=(Math.sin(i*1.723+seed*4)*.007+Math.cos(i*.394+seed)*.009+Math.sin(i*.093+seed)*.008)+.0015;p=p*(1+noise);out.push(p)}return out}

function alphaCompare(){let rows=stocks.filter(x=>S.selected.includes(x.id));let metric=[['市盈率 PE TTM','pe','×',false],['市净率 PB','pb','×',false],['ROE','roe','%',true],['营收同比增长','rev','%',true],['年化波动率','vol','%',false],['最大回撤（模拟）','draw','%',false],['Piotroski F','quality','/9',true]];return `${title('专业股票比较工作台','跨公司对比不仅要并列数字，还要处理行业差异、报表期间和口径一致性。',btn('查看领先标的研究','stocks','small'))}<section class="card pad" style="margin-bottom:17px"><div class="cardhead"><h3>选择需要比较的股票（2–5 只）</h3>${tag(`${S.selected.length} / 5 已选`,'blue')}</div><div class="selection">${stocks.map(x=>`<label class="chipbutton ${S.selected.includes(x.id)?'active':''}" style="cursor:pointer"><input type="checkbox" data-selectstock="${x.id}" ${S.selected.includes(x.id)?'checked':''} style="accent-color:var(--accent)"> ${x.name}</label>`).join('')}</div></section><div class="grid twoone">${card('核心财务与风险指标矩阵',simpleTable(['指标',...rows.map(x=>x.name)],metric.map(m=>[`<b>${m[0]}</b>`,...rows.map(x=>`${x[m[1]]}${m[2]}`)])),tag('同口径检查','good'),'财务/估值数据均为模拟值')}${card('研究洞察 · 不生成黑箱排名',`<div class="insight"><b>相对优势与代价</b><br>高 ROE 与高估值可能同时出现，低波动不代表没有基本面风险。专业比较应明确权重与行业适用范围。</div><div class="vlist sectionspace">${rows.map(x=>`<div class="row"><div><b>${x.name}</b><small>${x.industry} · ROE ${x.roe}%</small></div>${tag('F '+x.quality+'/9',x.quality>=7?'good':'neutral')}</div>`).join('')}</div><div class="notice sectionspace">当前模拟标的分属多个行业，不输出跨行业综合“最佳股票”结论。</div>` )}</div>`}
function maBacktest(fast,slow,cost){let prices=series(1.8,260),sig=Array(prices.length).fill(0),values=[100],buyhold=[100],tradeCount=0;for(let i=1;i<prices.length;i++){let v=values[values.length-1],b=buyhold[buyhold.length-1]*(prices[i]/prices[i-1]);buyhold.push(b);if(i>=slow){let mf=prices.slice(i-fast+1,i+1).reduce((a,c)=>a+c,0)/fast,ms=prices.slice(i-slow+1,i+1).reduce((a,c)=>a+c,0)/slow;sig[i]=mf>ms?1:0}else sig[i]=0;if(sig[i]!==sig[i-1]&&i>=slow){v*=1-cost/100;tradeCount++}v*=sig[i-1]?(prices[i]/prices[i-1]):1;values.push(v)}let dd=0,max=values[0];for(const v of values){max=Math.max(max,v);dd=Math.min(dd,v/max-1)}return {values,buyhold,ret:(values.at(-1)/100-1)*100,bench:(buyhold.at(-1)/100-1)*100,maxdd:dd*100,trades:tradeCount}}
function plotPair(a,b,height=215){const mix=[...a,...b],min=Math.min(...mix),max=Math.max(...mix),span=max-min||1,w=584,x=i=>8+i/(a.length-1)*w,y=v=>height-14-(v-min)/span*(height-29),pa=a.map((v,i)=>`${x(i).toFixed(2)},${y(v).toFixed(2)}`).join(' '),pb=b.map((v,i)=>`${x(i).toFixed(2)},${y(v).toFixed(2)}`).join(' ');return `<svg class="chartsvg" style="height:${height}px" viewBox="0 0 600 ${height}" preserveAspectRatio="none"><defs><linearGradient id="equityFill" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#0b9484" stop-opacity=".15"/><stop offset="1" stop-color="#0b9484" stop-opacity=".01"/></linearGradient></defs>${[.25,.5,.75].map(n=>`<line x1="8" y1="${n*height}" x2="592" y2="${n*height}" stroke="#e8eff2" stroke-dasharray="4 5"/>`).join('')}<polygon points="8,${height-5} ${pa} 592,${height-5}" fill="url(#equityFill)"/><polyline points="${pb}" stroke="#c2a377" stroke-width="2.2" fill="none" stroke-dasharray="5 5"/><polyline points="${pa}" stroke="#07897b" stroke-width="2.7" fill="none"/><circle cx="592" cy="${y(a.at(-1))}" r="3.5" fill="#07897b"/><circle cx="592" cy="${y(b.at(-1))}" r="3.5" fill="#c2a377"/></svg>`}
function alphaStrategy(){let o=S.strategyOut||maBacktest(S.fast,S.slow,S.cost);let resultClass=o.ret>=0?'green':'red';return `${title('Strategy Lab · 策略验证实验室','用可重复的规则与假设做实验：参数、交易成本、风险与样本局限全部可见。',btn(`${ic('play')} 重新运行实验`,'runStrategy','primary'))}<div class="grid onetwo"><section class="card pad"><div class="cardhead"><h3>策略与模型参数</h3>${tag('合成样本','warn')}</div><div class="stack"><label class="field">策略模板<select id="strategyMode"><option value="ma" selected>双均线趋势（MA Crossover）</option><option value="rsi" disabled>RSI 均值回归（后续扩展）</option><option value="factor" disabled>多因子研究（后续扩展）</option></select></label><div class="grid g2"><label class="field">快均线（交易日）<input id="fast" type="number" value="${S.fast}" min="3" max="90"></label><label class="field">慢均线（交易日）<input id="slow" type="number" value="${S.slow}" min="10" max="150"></label></div><label class="field">单次交易成本（%）<input id="cost" type="number" value="${S.cost}" min="0" max="3" step="0.05"></label><div class="line"></div><div class="smalltext">数据：260 个合成交易日 · 初始净值 100 · 日终信号、下一交易日收益生效 · 不含停牌、滑点、税费与真实撮合。</div><button class="btn primary" data-action="runStrategy">运行模拟回测 →</button><div class="notice">仅展示策略开发流程，不能据此推断真实收益或未来表现。</div></div></section>${card('策略权益曲线 vs 基准',`<div class="grid g3">${kpi('模拟策略总收益',`${o.ret>=0?'+':''}${o.ret.toFixed(1)}%`,'仅本轮合成样本',o.ret>=0?'+':'−')}${kpi('最大回撤',`${o.maxdd.toFixed(1)}%`,'样本内历史峰谷')}${kpi('交易切换次数',o.trades+' 次','含双向变仓')}</div><div style="padding:12px 0 0">${plotPair(o.values,o.buyhold,215)}</div><div class="fakelegend"><span><i style="background:#07897b"></i>策略净值</span><span><i style="background:#c4a879"></i>基准收益：${o.bench.toFixed(1)}%</span><span>手续费：${S.cost}% / 次</span></div><div class="insight sectionspace"><b>AI 可以解释，但不能替代验证：</b> 需要进行多时期样本外分析、滚动检验、交易约束和费用敏感性测试。图中结果不代表真实资产表现。</div>`,tag('Strategy Experiment','blue'))}</div><div class="grid g2 sectionspace">${card('回测验证清单',`<div class="vlist"><div class="row"><div><b>无未来函数 / 信号时间</b><small>基于上一日信号决定下一日持仓</small></div>${tag('演示 function regDocs(){let list=S.docs.filter(d=>(S.docType==='all'||d.type===S.docType)&&(!S.docQuery||[d.name,d.company,d.type].join(' ').toLowerCase().includes(S.docQuery.toLowerCase())));return `${title('Evidence Hub · 机构证据资料中心','把财报、公告、尽调底稿和调查结论组织成可引用、可管理、可回溯的证据网络。',btn(`${ic('upload')} 添加模拟资料`,'addDoc','primary'))}<div class="grid g4">${kpi('资料索引',String(S.docs.length).padStart(2,'0'),'本次会话 · 全部为虚构文件')}${kpi('待核验文件',String(S.docs.filter(d=>d.status==='待校验').length).padStart(2,'0'),'元信息或版本缺失')}${kpi('受限内部资料','01','正式版受权限控制')}${kpi('关联风险案件','04','示例案件证据链')}</div><div class="grid twoone sectionspace">${card('资料库 · 分类检索',`<div class="flex" style="margin-bottom:14px;flex-wrap:wrap"><input id="docQuery" type="text" value="${escaped(S.docQuery)}" placeholder="搜索文件名、企业或类型…" style="flex:1;min-width:200px;border:1px solid #dfe7ed;background:#f9fbfd;padding:11px;border-radius:10px;outline:0"><select id="docType" style="padding:10px;border:1px solid #dfe7ed;border-radius:10px"><option value="all">全部分类</option>${['财务','尽调','内部','公告'].map(x=>`<option ${S.docType===x?'selected':''}>${x}</option>`).join('')}</select></div>${simpleTable(['文件 / 关联主体','类型','日期','状态'],list.map(d=>[`<button class="link" data-doc="${d.id}">${d.name}</button><div class="smalltext">${d.company}</div>`,d.type,d.date,tag(d.status,d.status==='已索引'?'good':'neutral')]))}<p class="smalltext sectionspace">点文件名可打开模拟元数据与证据关联预览；原型没有真实 PDF 字节或机构权限。</p>`,tag('DOCUMENT METADATA','purple'))}${card('证据链：从筛查到结论',`<div class="flow-rail" style="margin-bottom:15px"><span class="flow-node">财务报表 / 公告</span><span class="flow-arrow">→</span><span class="flow-node">计算规则 R1</span><span class="flow-arrow">→</span><span class="flow-node">RG-2401 案件</span><span class="flow-arrow">→</span><span class="flow-node">复核结论</span></div><div class="insight"><b>机构资料不是知识随意混用。</b><br>原始文件需保存来源、报告期、文档版本、访问权限和引用位置。AI 只能读取其获得授权的材料，不能跨客户泄露数据。</div><div class="line"></div><div class="vlist"><div class="row"><div><b>财务报表全文</b><small>演示报告文件名与页数</small></div>${tag('已索引','good')}</div><div class="row"><div><b>审计附件</b><small>文件原文无法验证</small></div>${tag('待补','warn')}</div><div class="row"><div><b>内部工作底稿</b><small>须使用机构角色权限</small></div>${tag('限制访问','purple')}</div></div><button class="btn small sectionspace" data-action="cases">打开关联调查 →</button>` )}</div>`}
function regCases(){let cs=S.cases.filter(c=>S.caseFilter==='all'||c.status===S.caseFilter);return `${title('Casework · 调查与人工复核','金融规则只是线索；最终机构结论需要证据、审核人、时间和规则版本。',btn(`${ic('file')} 生成模拟审查报告`,'reports','primary'))}<div class="grid g3">${kpi('开放案件',S.cases.filter(c=>!['已确认线索','已排除'].includes(c.status)).length+' 件','包含待补材料')}${kpi('已完成复核',S.reviews.length+' 条','本次会话操作')}${kpi('审计完整性','待确认','正式版依赖 Blocks 权限')}</div><div class="grid twoone sectionspace">${card('调查工作队列',`<div class="flex between" style="margin-bottom:12px"><span class="smalltext">点击任一案件查看计算和证据</span><select id="caseFilter" style="border:1px solid #dfe7ed;padding:9px;border-radius:10px"><option value="all">全部状态</option>${['待复核','复核中','待补材料','已确认线索','已排除'].map(x=>`<option value="${x}" ${S.caseFilter===x?'selected':''}>${x}</option>`).join('')}</select></div>${simpleTable(['案件','线索','优先级','状态'],cs.map(c=>[`<button class="link" data-case="${c.id}">${c.id}</button><div class="smalltext">${c.company}</div>`,`<button class="link" data-case="${c.id}">${c.title}</button>`,tag(c.severity,c.severity==='高优先'?'bad':c.severity==='中优先'?'warn':'neutral'),tag(c.status,c.status==='已确认线索'?'good':'purple')]))}`)}${card('复核动作与审计轨迹',`${S.reviews.length?`<div class="vlist">${S.reviews.slice(0,6).map(x=>`<div class="row"><div><b>${x.id} · ${escaped(x.status)}</b><small>${escaped(x.note||'无备注')} · 演示审核员</small></div>${tag('已记录','good')}</div>`).join('')}</div>`:`<div class="insight"><b>尚无模拟复核动作。</b><br>打开案件，查看风险计算、材料状态，记录意见后选择继续调查、确认线索或排除线索。</div>`}<div class="line"></div><div class="bullet-row"><div class="marker">①</div><div><b>规则与数据版本</b><p>算法公式、参数、报告期、来源。</p></div></div><div class="bullet-row"><div class="marker">②</div><div><b>人工复核与责任人</b><p>结论理由、复核角色、时间戳。</p></div></div><div class="bullet-row"><div class="marker">③</div><div><b>权限与导出</b><p>正式不可篡改留痕需平台后端。</p></div></div>` )}</div>`}
function regPolicy(){let p=policies[S.policySelected];return `${title('Regulatory Intelligence · 监管变化影响分析','检测法规版本差异、识别受影响业务及合规任务，由专业人员确认法律解释。',btn('新增模拟合规待办','addTask','primary'))}<div class="grid twoone"><section class="card pad"><div class="cardhead"><h3>政策变化对比</h3>${tag('虚构法规演示','warn')}</div><div class="stack sm">${policies.map((x,i)=>`<button class="list-select ${S.policySelected===i?'active':''}" data-policy="${i}"><span><b>${x.title}</b><small>${x.regulator}</small></span>${ic('chevron')}</button>`).join('')}</div><div class="grid g2 sectionspace"><div class="tile" style="background:#fff8f8"><div class="eyebrow" style="color:#b85d69">OLD / V1</div><p>${p.old}</p></div><div class="tile" style="background:#f7fbf7;border-color:#dcebe2"><div class="eyebrow" style="color:#21846f">NEW / V2</div><p>${p.now}</p></div></div><div class="insight sectionspace"><b>AI 建议的候选影响：</b> ${p.impact}<small>演示条款不是现实法规；正式版需链接原文、发布日期、生效日期及适用主体，并由法律/合规人员审核。</small></div></section>${card('从政策文字变成合规任务',`<div class="vlist"><div class="row"><div><b>核对实际法规版本</b><small>生效时间、主体、原文真实性</small></div>${tag('待复核','warn')}</div><div class="row"><div><b>评估内部资料流程是否受影响</b><small>将缺失材料同步至资料中心</small></div>${tag('候选任务','purple')}</div><div class="row"><div><b>安排合规部门评审</b><small>明确责任人和后续截止日期</small></div>${tag('人工审批','neutral')}</div>${S.policyTasks.map(x=>`<div class="row"><div><b>${escaped(x)}</b><small>本次会话模拟任务</small></div>${tag('新建','good')}</div>`).join('')}</div><button class="btn primary small sectionspace" data-action="addTask">添加候选任务</button>` )}</div><div class="grid g2 sectionspace">${card('监管主题分类',`<div class="selection">${['信息披露','上市公司治理','关联交易','资管与适当性','金融犯罪防范','内控与审计'].map(x=>tag(x,'purple')).join('')}</div><p class="smalltext sectionspace">后续可绑定 CSRC、沪深交易所和其他官方授权来源，将修订版本作为增量文档。</p>`)}${card('政策-主体-资料联动',`<div class="flow-rail"><span class="flow-node">监管变化</span><span class="flow-arrow">→</span><span class="flow-node">适用业务识别</span><span class="flow-arrow">→</span><span class="flow-node">内部制度核对</span><span class="flow-arrow">→</span><span class="flow-node">合规任务</span></div><div class="notice sectionspace">AI 的政策解释仅是初步筛选，不可作为最终法律意见。</div>` )}</div>`}

v>`}

function v3Strat(){let o=S.strategyOut||maBacktest(S.fast,S.slow,S.cost);let split=Math.floor(o.values.length*.70);let p=o.values;let benchmark=o.buyhold;function ret(a,b){return ((b/a-1)*100).toFixed(2)+'%'}let oos=ret(p[split],p[p.length-1]);let baseoos=ret(benchmark[split],benchmark[benchmark.length-1]);let costs=Number(S.cost).toFixed(2);let heatFast=[5,8,11,14,18],heatSlow=[25,35,45,60,80];function heatCalc(f,s){let r=maBacktest(f,s,S.cost),v=r.values.slice(0,Math.floor(r.values.length*.70)+1),rets=v.slice(1).map((x,i)=>x/v[i]-1),avg=rets.reduce((a,b)=>a+b,0)/rets.length,sd=Math.sqrt(rets.reduce((a,b)=>a+(b-avg)**2,0)/rets.length);return sd>1e-9?Math.sqrt(252)*avg/sd:0}let heat=heatFast.map(f=>heatSlow.map(s=>heatCalc(f,s)));let lo=Math.min(...heat.flat()),hi=Math.max(...heat.flat());return `${v3Head('QUANT / STRATEGY VALIDATION','策略实验室 · 强调稳健，而不是回测暴利','可调整参数，并分别展示样本内与样本外；不以示例收益宣称策略有效。',`<button class="v3-btn" data-action="runStrategy">↻ 重算演示策略</button>`)}<div class="v3-strat-layout"><div class="v3-panel"><div class="v3-card-top"><b>参数配置</b><span class="v3-label simulation">260 日合成序列</span></div><label class="v3-field">快线周期 <b>${S.fast} 日</b><input id="fast" type="range" min="3" max="25" step="1" value="${S.fast}" data-v3-input="fast"></label><label class="v3-field">慢线周期 <b>${S.slow} 日</b><input id="slow" type="range" min="26" max="95" step="1" value="${S.slow}" data-v3-input="slow"></label><label class="v3-field">单次切换成本 <b>${S.cost}%</b><input id="cost" type="range" min="0" max="1" step=".05" value="${S.cost}" data-v3-input="cost"></label><button class="v3-btn full" data-action="runStrategy">计算当前参数</button><div class="v3-rulebox"><b>验证纪律</b><p>固定 70% / 30% 时间切分。后 30% 为展示区间，当前 UI 仅做固定参数的样本外重放。</p><p>热力图显示相邻参数敏感度，不能用这张图在全量样本上挑选最优参数后声称样本外有效。</p></div></div><div class="v3-panel"><div class="v3-card-top"><div><b>策略净值 vs 买入持有基准</b><div class="v3-mini">图表具有净值轴、时间轴、样本外分界及基准</div></div><span class="v3-label verified">透明回测假设</span></div>${eqLineChart(p,benchmark,split)}<div class="v3-kv-row"><span>样本外策略：<b class="${parseFloat(oos)>=0?'green':'red'}">${oos}</b></span><span>样本外基准：<b>${baseoos}</b></span><span>交易切换：<b>${o.trades} 次</b></span></div></div></div><div class="v3-lower-grid"><div class="v3-panel"><div class="v3-card-top"><div><b>参数敏感度热力图</b><div class="v3-mini">快线 × 慢线 · 年化 Sharpe（无风险利率假设 0%，只使用样本内 70%）</div></div>${tag('研究诊断','warn')}</div><div class="v3-heatmap"><div></div>${heatSlow.map(s=>`<small>${s}d</small>`).join('')}${heatFast.map((f,i)=>`<small>${f}d</small>${heat[i].map((v,j)=>{let x=(v-lo)/(hi-lo||1);return `<button title="快线 ${f} 慢线 ${heatSlow[j]}：演示指标 ${v.toFixed(2)}" data-v3="heatParam" data-fast="${f}" data-slow="${heatSlow[j]}" style="background:rgba(13,149,142,${(.12+x*.8).toFixed(2)});color:${x>.52?'white':'#24465b'}">${v.toFixed(1)}</button>`}).join('')}`).join('')}</div><div class="v3-tiny">选择格子将载入参数；随后点击“计算当前参数”重算主曲线。热力图只用前 70% 合成训练数据计算 Sharpe；反复查看样本外表现仍会造成测试集污染，正式验证须重新留出未知数据。</div></div><div class="v3-panel"><div class="v3-card-top"><b>过拟合与交易约束检查</b><span class="v3-label warning">审慎验证</span></div><div class="v3-audit-items"><div>⚠ <span>样本量有限</span><b>260 日</b></div><div>⚠ <span>真实滑点 / 停牌 / 涨跌停</span><b>尚未建模</b></div><div>✓ <span>单次切换成本</span><b>${costs}%</b></div><div>✓ <span>时间隔离</span><b>70% / 30%</b></div><div>⚠ <span>参数搜索后重新留出测试集</span><b>未完成</b></div></div><div class="v3-rulebox"><b>模型解释</b><p>演示策略即使跑输基准，也是有效的研究结果。真正可信的策略需要多时期、样本外、成本、成交限制及稳健性检验。</p></div></div></div>`}

function sfRules(c,p){

 check('S03','客户风险等级','Risk capacity gate',c.risk>=p.risk?'pass':'block',`客户 R${c.risk} / 产品 PR${p.risk}`),
 check('S04','期限覆盖锁定','Horizon vs lock-in',c.horizon>=p.lock?'pass':'block',`${c.horizon} 年 / years ≥ ${p.lock} 年 / years`),
 check('S05','流动性约束','Liquidity requirement',c.liquidity<=p.liquidity?'pass':'block',`需求 need ${c.liquidity}/3 · 产品 supply ${p.liquidity}/3`),
 check('S06','投资者资格','Investor eligibility',!p.qualifiedOnly||c.qualified?'pass':'block',p.qualifiedOnly?(c.qualified?'合格投资者（模拟）':'该产品仅面向合资格客户'):'无限定准入（模拟）'),
 check('S07','产品已批准','Product approved',p.approved?'pass':'block','机构产品目录已审核（模拟） / Approved catalog (demo)'),
 check('S08','最低认购额','Minimum subscription',c.asset>=p.minAmount?'pass':'block',`可投资资金 ${c.asset} 万 / required ${p.minAmount} 万 (demo)`),
 check('S09','持仓集中度','Portfolio concentration',c.concentration>p.cap?'review':'pass',`拟配置占比 ${c.concentration}% / 内部复核阈值 ${p.cap}%`, 'review'),
 check('S10','目标适配提示','Objective alignment',Math.abs(c.goal-p.goal)>1?'review':'pass',`客户目标 ${sfObj[c.goal]} / 产品目标 ${sfObj[p.goal]}`,'review')
 ];
 let blocked=r.some(x=>x.category==='hard'&&x.state==='block');
 let reviewing=r.some(x=>x.state==='review');
 let status=blocked?'block':reviewing?'review':'pass';
 return {rules:r,status,hardPass:!blocked,review:reviewing,reason:blocked?'必要条件未通过 / Mandatory gate failed':reviewing?'需要人工复核 / Human review required':'通过，进入审批 / Eligible for approval'};

 let fees=Math.max(0,100-25*p.fee);

}

function sfRadar(c,p,score){let vals=score?score.metrics:[0,0,0,0,0],names=['目标/Goal','期限/Horizon','流动/Liquidity','风险/Risk','费用/Fees'],cx=150,cy=132,r=94;

 const polygon=(v)=>v.map((x,i)=>pt(i,x).join(',')).join(' ');
 let web=[20,40,60,80,100].map(v=>`<polygon points="${polygon([v,v,v,v,v])}" fill="none" stroke="#e5eaf0"/>`).join('');
 let axes=names.map((n,i)=>{let q=pt(i,125);return `<line x1="${cx}" y1="${cy}" x2="${pt(i,100)[0]}" y2="${pt(i,100)[1]}" stroke="#e2e9f0"/><text x="${q[0]}" y="${q[1]}" text-anchor="middle" font-size="10" fill="#62758c">${n}</text>`;}).join('');
 return `<svg width="100%" viewBox="0 0 310 275" role="img" aria-label="Illustrative radar, not a regulatory suitability test">${web}${axes}<polygon points="${polygon(vals)}" fill="#d5ad5b" fill-opacity=".17" stroke="#bd8b36" stroke-width="2"/></svg>`;
}
